# Design C soup ensemble (docs/12_design_c_soup.md), 2026-10-09: one line per run, dispatched in this order to the free NVIDIA
# GPUs of cluster/gpus.conf by cluster/run_soup.py (adler40 RTX 4090 and 4080, knecht24 three RTX 3060). Columns: name | u1soup options.
# Speeds (2^20 words, 65,536 processors): about 1,000 ticks/s on the 4090, so 8,000,000 ticks are 2 to 3 hours there and longer on a 3060.
# A. Random soups: nothing chosen. The soup is random, every slot that falls empty is re-placed at a random position, so the soup samples
#    its own content (copier density 2e-8 per placement, about 2,300 placements per tick at 65,536 processors: one copier per ~20,000 ticks).
#    Result after 700,000 ticks (stopped early): the soup cools into inert patterns (6 % of placements land on all-zero words), the inflow
#    of processors stops sampling program space, births stay at the 4 copiers of the initial fill. Kept as the record (stats to ~700k).
rand_p16_mu0        | --N 1048576 --P 65536 --ticks 8000000 --mu 0 --seed 1 --report-every 1000 --census-every 100000
rand_p16_mu01       | --N 1048576 --P 65536 --ticks 8000000 --mu 0.01 --seed 1 --report-every 1000 --census-every 100000
rand_p13_mu0        | --N 1048576 --P 8192 --ticks 8000000 --mu 0 --seed 1 --report-every 1000 --census-every 100000
# A2. Random soups whose inflow brings random code (--inflow words): every placed processor writes 8 uniformly random words at its position,
#     so the soup keeps sampling all 2^40 programs (one copier per ~20,000 ticks at 65,536 processors, ~170,000 at 8,192).
words_p16_mu0       | --N 1048576 --P 65536 --ticks 6000000 --inflow words --mu 0 --seed 1 --report-every 1000 --census-every 100000
words_p13_mu0       | --N 1048576 --P 8192 --ticks 6000000 --inflow words --mu 0 --seed 1 --report-every 1000 --census-every 100000
words_p16_mu01      | --N 1048576 --P 65536 --ticks 6000000 --inflow words --mu 0.01 --seed 1 --report-every 1000 --census-every 100000
words_p11_mu0       | --N 1048576 --P 2048 --ticks 6000000 --inflow words --mu 0 --seed 1 --report-every 1000 --census-every 100000
# B. Seeded soups (the brief): 4,096 ancestors cycling through the 462 robust exp06c copiers, inflow of random processors on, mu at three levels.
seed462_mu01        | --N 1048576 --P 65536 --ticks 3000000 --ancestors @cluster/soup_seeds_robust.txt --n-ancestors 4096 --mu 0.01 --seed 1 --report-every 1000 --census-every 100000
seed462_mu002       | --N 1048576 --P 65536 --ticks 3000000 --ancestors @cluster/soup_seeds_robust.txt --n-ancestors 4096 --mu 0.002 --seed 1 --report-every 1000 --census-every 100000
seed462_mu05        | --N 1048576 --P 65536 --ticks 3000000 --ancestors @cluster/soup_seeds_robust.txt --n-ancestors 4096 --mu 0.05 --seed 1 --report-every 1000 --census-every 100000
# C. Controls: background rays instead of birth mutation; a closed soup (no inflow, pure Tierra style); the fecundity-two copier alone.
rand_p16_rays       | --N 1048576 --P 65536 --ticks 6000000 --mu 0 --rays 1 --seed 1 --report-every 1000 --census-every 100000
seed462_closed_mu01 | --N 1048576 --P 65536 --ticks 3000000 --ancestors @cluster/soup_seeds_robust.txt --n-ancestors 4096 --mu 0.01 --spontaneous 0 --seed 1 --report-every 1000 --census-every 100000
fec2_mu01           | --N 1048576 --P 65536 --ticks 3000000 --ancestors 0x01b30b190e --n-ancestors 4096 --mu 0.01 --seed 1 --report-every 1000 --census-every 100000
# D. The three intact exp06c replicators, one ancestor each in the code+1 pattern they were found in, no inflow (the record; seconds each).
intact_a2c841f269   | --N 65536 --P 4096 --ticks 10000 --ancestors 0xa2c841f269 --n-ancestors 1 --fill pattern --spontaneous 0 --seed 1 --report-every 10 --census-every 1000
intact_a9344f2e8d   | --N 65536 --P 4096 --ticks 10000 --ancestors 0xa9344f2e8d --n-ancestors 1 --fill pattern --spontaneous 0 --seed 1 --report-every 10 --census-every 1000
intact_d9b17359e8   | --N 65536 --P 4096 --ticks 10000 --ancestors 0xd9b17359e8 --n-ancestors 1 --fill pattern --spontaneous 0 --seed 1 --report-every 10 --census-every 1000
