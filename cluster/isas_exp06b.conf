# exp06b candidate ISAs for layout L2 (von Neumann: 16 words of 4 bits, the 8 instructions live at M[0..7], fetch reads M[PC]).
# Columns: name | a p I | primitives (opcode order). All W=4. Each line = one 2^32 sweep with gpu/u1_l2 (17 runs per program).
# Pointer instructions address the whole memory through M[op]; direct operands reach only M[0..1] (o=3) or M[0..3] (o=2).
l2_ldst_ind   | 4 3 4 | LD,ST,LDIND,STIND,INCM,ADD,JNZ,HALT
l2_swap_ind   | 4 3 4 | SWAP,LDIND,STIND,INCM,ADD,NAND,JZ,HALT
l2_ldi_ind    | 4 3 4 | LDI,LDIND,STIND,INCM,DECM,NAND,SKNZ,HALT
l2_champ_ind  | 4 3 4 | SWAP,ADD,NAND,SKZ,LDIND,STIND,INCM,HALT
l2_jc_ind     | 4 3 4 | SWAP,ADD,NAND,JC,LDIND,STIND,INCM,HALT
l2_nohalt_ind | 4 3 4 | LD,ST,LDIND,STIND,INCM,NAND,SKZ,JMP
l2_o2_crawl   | 4 3 4 | LDIND,STIND,INCM,JNZ
# exp06c (2026-10-08): the crawler with more room. 5 bytes = 8 instructions of 5 bits (W = I = 5: 2 opcode + 3 operand bits), copy-only sweeps.
# Columns with four geometry numbers: W a p I. The copy test accepts any non-overlapping offset in [2^p, 2^a - 2^p].
l2c_crawl_a5     | 4 5 3 4 | LDIND,STIND,INCM,JNZ
l2c_crawl_w5_a5  | 5 5 3 5 | LDIND,STIND,INCM,JNZ
