# Universe-1 Life ensemble: one line per run, dispatched to free GPU slots (cluster/gpus.conf). Columns: name | u1life options
# Phase A: two ISAs x three seeds at 1024^2 for 200k ticks (~ minutes per run on the 4090, longer on the 3060s)
champ_s1   | --isa SWAP,ADD,NAND,SKZ --N 1024 --seed 1 --ticks 200000 --report-every 1000 --income 20
champ_s2   | --isa SWAP,ADD,NAND,SKZ --N 1024 --seed 2 --ticks 200000 --report-every 1000 --income 20
champ_s3   | --isa SWAP,ADD,NAND,SKZ --N 1024 --seed 3 --ticks 200000 --report-every 1000 --income 20
swap_s1    | --isa SWAP,LDI,NAND,ADD,ROL,SKNZ,INC,HALT --N 1024 --seed 1 --ticks 200000 --report-every 1000 --income 8
swap_s2    | --isa SWAP,LDI,NAND,ADD,ROL,SKNZ,INC,HALT --N 1024 --seed 2 --ticks 200000 --report-every 1000 --income 8
swap_s3    | --isa SWAP,LDI,NAND,ADD,ROL,SKNZ,INC,HALT --N 1024 --seed 3 --ticks 200000 --report-every 1000 --income 8
# Phase B: parameter scan on the swap ISA (mutation and reproduction cost)
swap_mu32  | --isa SWAP,LDI,NAND,ADD,ROL,SKNZ,INC,HALT --N 1024 --seed 1 --ticks 200000 --report-every 1000 --income 8 --mu-bits 32
swap_mu512 | --isa SWAP,LDI,NAND,ADD,ROL,SKNZ,INC,HALT --N 1024 --seed 1 --ticks 200000 --report-every 1000 --income 8 --mu-bits 512
swap_rc64  | --isa SWAP,LDI,NAND,ADD,ROL,SKNZ,INC,HALT --N 1024 --seed 1 --ticks 200000 --report-every 1000 --income 8 --repro-cost 64
# Phase B (added 2026-10-08 after exp05 unary): the two new ISA candidates, three seeds each, same world parameters.
# add_jc: 8.53 M unary operators, no HALT (income 20 like the champion). codex_shr_mul: 3.04 M, HALT present (income 8 like the swap ISA).
jc_s1      | --isa SWAP,ADD,NAND,JC --N 1024 --seed 1 --ticks 200000 --report-every 1000 --income 20
jc_s2      | --isa SWAP,ADD,NAND,JC --N 1024 --seed 2 --ticks 200000 --report-every 1000 --income 20
jc_s3      | --isa SWAP,ADD,NAND,JC --N 1024 --seed 3 --ticks 200000 --report-every 1000 --income 20
shrmul_s1  | --isa SWAP,ADD,NAND,XOR,SHR,MUL,SKZ,HALT --N 1024 --seed 1 --ticks 200000 --report-every 1000 --income 8
shrmul_s2  | --isa SWAP,ADD,NAND,XOR,SHR,MUL,SKZ,HALT --N 1024 --seed 2 --ticks 200000 --report-every 1000 --income 8
shrmul_s3  | --isa SWAP,ADD,NAND,XOR,SHR,MUL,SKZ,HALT --N 1024 --seed 3 --ticks 200000 --report-every 1000 --income 8
# Phase C (exp10): the 512-step clock. Cost per organism run = ceil(steps/16) reaches 32, so income 36 keeps a full-cost organism at the
# same net budget (+4 per tick) as income 20 at 256 steps; income 20 at 512 steps went extinct within 1,000 ticks.
champ512_s1 | --isa SWAP,ADD,NAND,SKZ --N 1024 --seed 1 --ticks 200000 --report-every 1000 --income 36 --max-steps 512
# Phase D (overnight 2026-10-08): the runs are listed in cluster/overnight_plan.conf (node | slot | engine | run | options).
jc_4096_s1           | --isa SWAP,ADD,NAND,JC --N 4096 --seed 1 --ticks 1000000 --report-every 1000 --income 20 --ppm-every 2000
champ512_2048_s1     | --isa SWAP,ADD,NAND,SKZ --N 2048 --seed 1 --ticks 1800000 --report-every 1000 --income 36 --max-steps 512 --ppm-every 4000
cpu_jc_512_s1        | --isa SWAP,ADD,NAND,JC --N 512 --seed 1 --ticks 2500000 --report-every 1000 --income 20 --ppm-every 4000 --threads 18
jc_long_s1           | --isa SWAP,ADD,NAND,JC --N 1024 --seed 1 --ticks 4500000 --report-every 1000 --income 20 --ppm-every 5000
jc_long_s2           | --isa SWAP,ADD,NAND,JC --N 1024 --seed 2 --ticks 4500000 --report-every 1000 --income 20 --ppm-every 5000
jc_long_mu512        | --isa SWAP,ADD,NAND,JC --N 1024 --seed 1 --ticks 4000000 --report-every 1000 --income 20 --mu-bits 512 --ppm-every 5000
cpu_champ512_512_s1  | --isa SWAP,ADD,NAND,SKZ --N 512 --seed 1 --ticks 1000000 --report-every 1000 --income 36 --max-steps 512 --ppm-every 3000 --threads 16
swap_2048_s1         | --isa SWAP,LDI,NAND,ADD,ROL,SKNZ,INC,HALT --N 2048 --seed 1 --ticks 3000000 --report-every 1000 --income 8 --ppm-every 4000
swap_long_rc64       | --isa SWAP,LDI,NAND,ADD,ROL,SKNZ,INC,HALT --N 1024 --seed 1 --ticks 6000000 --report-every 1000 --income 8 --repro-cost 64 --ppm-every 5000
shrmul_long_s1       | --isa SWAP,ADD,NAND,XOR,SHR,MUL,SKZ,HALT --N 1024 --seed 1 --ticks 6000000 --report-every 1000 --income 8 --ppm-every 4000
cpu_swap_512_s1      | --isa SWAP,LDI,NAND,ADD,ROL,SKNZ,INC,HALT --N 512 --seed 1 --ticks 2500000 --report-every 1000 --income 8 --ppm-every 3000 --threads 8
swap_long_s2         | --isa SWAP,LDI,NAND,ADD,ROL,SKNZ,INC,HALT --N 1024 --seed 2 --ticks 4000000 --report-every 1000 --income 8 --ppm-every 5000
swap_long_s3         | --isa SWAP,LDI,NAND,ADD,ROL,SKNZ,INC,HALT --N 1024 --seed 3 --ticks 4000000 --report-every 1000 --income 8 --ppm-every 5000
cpu_jc_512_mu32      | --isa SWAP,ADD,NAND,JC --N 512 --seed 1 --ticks 1000000 --report-every 1000 --income 20 --mu-bits 32 --ppm-every 3000 --threads 8
