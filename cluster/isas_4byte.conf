# name | W a p I | ISA  — every line is a full 2^32-program sweep (program bits = 2^p * I = 32)
# W=4, 8 instr x 4 bits. o=3 -> 1 operand bit (address 0 = A, 1 = M[1]; jumps reach 0/1; LDI 0/1)
w4_o3_core      | 4 2 3 4 | LD,ST,LDI,NAND,ADD,SHL,JZ,HALT
w4_o3_bool      | 4 2 3 4 | LD,ST,NOT,AND,OR,XOR,SKZ,HALT
w4_o3_arith     | 4 2 3 4 | LD,ST,ADD,SUB,SHL,SHR,JNZ,HALT
w4_o3_swap      | 4 2 3 4 | SWAP,LDI,NAND,ADD,ROL,SKNZ,INC,HALT
# W=4, o=2 -> 2 operand bits: 4 addresses, jumps reach 0..3
w4_o2_nand      | 4 2 3 4 | LD,ST,NAND,JZ
w4_o2_add       | 4 2 3 4 | SWAP,ADD,NAND,SKZ
# W=4, o=4 -> 0 operand bits: 16 zero-address opcodes (register-only, a=1 keeps M[1] for binary inputs)
w4_o4_full      | 4 1 3 4 | LD,ST,NOT,AND,OR,XOR,ADD,SUB,INC,DEC,SHL,SHR,ROL,SKZ,SKNZ,HALT
# W=2, 16 instr x 2 bits (o=1 -> 1 operand bit)
w2_o1           | 2 2 4 2 | NAND,JZ
w2_o1_swap      | 2 2 4 2 | SWAP,SKNZ
# W=1, 32 instr x 1 bit
w1_nand_jz      | 1 2 5 1 | NAND,JZ
w1_nand_skz     | 1 2 5 1 | NAND,SKZ
# W=8, 4 instr x 8 bits (o=4 -> 4 operand bits, 16 addresses)
w8_o4           | 8 4 2 8 | LD,ST,LDI,NOT,AND,OR,XOR,ADD,SUB,SHL,SHR,JMP,JZ,JC,SWAP,HALT
# ---- exp05 candidates (added 2026-10-07 after the translation runs). Each line = one 2^32 sweep, ~30-60 s on the 9 GPUs.
# A. the "combined unary ISA" proposal itself, as a control: champion + HALT + LD/ST (o=3 -> operand field shrinks to 1 bit)
w4_prop_combined | 4 2 3 4 | SWAP,ADD,NAND,SKZ,HALT,LD,ST,LDI
# B. one-primitive ablations of the o=2 champion SWAP,ADD,NAND,SKZ (keeps 2 operand bits)
w4_o2_add_sknz  | 4 2 3 4 | SWAP,ADD,NAND,SKNZ
w4_o2_add_jz    | 4 2 3 4 | SWAP,ADD,NAND,JZ
w4_o2_add_jc    | 4 2 3 4 | SWAP,ADD,NAND,JC
w4_o2_xor       | 4 2 3 4 | SWAP,ADD,XOR,SKZ
w4_o2_sub       | 4 2 3 4 | SWAP,SUB,NAND,SKZ
w4_o2_adc       | 4 2 3 4 | SWAP,ADC,NAND,SKZ
w4_o2_shr       | 4 2 3 4 | SWAP,ADD,SHR,SKZ
w4_o2_rol       | 4 2 3 4 | SWAP,ADD,NAND,ROL
# C. no conditional control flow (PC still wraps: 32 passes over the 8 instructions, result at step 256)
w4_o2_nocond    | 4 2 3 4 | SWAP,ADD,NAND,SHR
# D. geometry alternative: 4 instructions x 8 bits (p=2, I=8) -> wide operand fields
w4_i8_o3        | 4 2 2 8 | SWAP,ADD,NAND,SKZ,HALT,LDI,SHR,ROL
w4_i8_o4        | 4 4 2 8 | LD,ST,LDI,NOT,AND,OR,XOR,ADD,SUB,SHL,SHR,JMP,JZ,JC,SWAP,HALT
# E. Codex's proposal after the depth-4 run (o=3, 1 operand bit): targets gray/bitrev (SHR, XOR), mul_hi (MUL), hamming
w4_codex_shr_mul | 4 2 3 4 | SWAP,ADD,NAND,XOR,SHR,MUL,SKZ,HALT
# F. same idea but keeping 2 operand bits by dropping HALT and NAND (XOR+SHR cover the Boolean side with ADD)
w4_o2_xor_shr    | 4 2 3 4 | SWAP,ADD,XOR,SHR
